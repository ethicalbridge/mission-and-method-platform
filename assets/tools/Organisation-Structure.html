function dashboard(){

 const ds=deptList();
 return title('Dashboard','A live view of your team, roles and work.')+`<div class="grid metrics"><div class="card metric"><span class="icon">◉</span><div class="value">${filled}</div><div class="label">Filled roles <span class="help" title="Roles marked Filled, including founders and staff.">ⓘ</span></div></div><div class="card metric"><span class="icon">◫</span><div class="value">${ds.length}</div><div class="label">Departments</div></div><div class="card metric"><span class="icon">◇</span><div class="value">${open}</div><div class="label">Open roles</div></div><div class="card metric"><span class="icon">▤</span><div class="value">${state.activities.length}</div><div class="label">Annual activities</div></div></div><div class="card"><h2>Team by department</h2><p class="hint">Filled and open roles show where capacity is needed.</p>${ds.map(d=>{let n=state.roles.filter(r=>r.dept===d).length;return `<div class="deptrow"><span>${esc(d)}</span><div class="bar"><span style="width:${Math.round(n/state.roles.length*100)}%"></span></div><b>${n}</b></div>`}).join('')}</div>`

function organigram(){let roots=state.roles.filter(r=>!r.reports||!role(r.reports));let ds=deptList().filter(d=>d!=='Leadership');return title('Organigram','See reporting lines and open a role to inspect its responsibilities and connections.')+`<div class="toolbar"><div class="hint">Click a role card to view or edit it. Reporting lines follow the “Reports to” field.</div><button class="btn primary" onclick="openRoleForm()">+ Add role</button></div><div class="card orgroot">${roots.map(r=>`<button class="rolebox" onclick="showRole('${r.id}')"><b>${esc(r.title)}</b><small>${esc(r.person||r.status)}</small></button>`).join('')}</div><div class="orggrid">${ds.map(d=>`<section class="orgdept"><h3>${esc(d)}</h3>${state.roles.filter(r=>r.dept===d).map(r=>`<button class="rolebox" onclick="showRole('${r.id}')"><b>${esc(r.title)}</b><small>Reports to ${esc(role(r.reports)?.title||'—')} · ${esc(r.status)}</small></button>`).join('')}</section>`).join('')}</div>`}

function plans(){let sorted=[...state.activities].sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));let a=sorted.filter(x=>(x.title+' '+x.dept+' '+x.priority+' '+(role(x.role)?.title||'')).toLowerCase().includes(filter.toLowerCase()));let views=`<div class="tabsmini">${['list','calendar','timeline'].map(v=>`<button class="btn ${view===v?'active':''}" onclick="view='${v}';render()">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div>`;let body='';if(view==='list')body=`<div class="card" style="padding:0">${a.map(x=>`<div class="activity"><div><b>${esc(x.title)}</b><small>${esc(x.priority||'Priority not set')} · ${esc(x.project||'No project')}</small></div><div><b>${esc(role(x.role)?.title||'Unassigned')}</b><small>${esc(x.dept)}</small></div><div><span class="pill ${x.status==='Done'?'done':x.status==='In progress'?'progress':'planned'}">${esc(x.status)}</span><small>${esc(x.due||'No date')} · ${pct(x.progress)}%</small></div><button class="btn" onclick="openActivityForm('${x.id}')">Edit</button></div>`).join('')||'<div class="empty">No activities yet. Add your first activity.</div>'}</div>`;if(view==='calendar'){let groups={};a.forEach(x=>{let m=x.due?x.due.slice(0,7):'Unscheduled';(groups[m]??=[]).push(x)});body=`<div class="calendar">${Object.keys(groups).sort().map(m=>`<div class="card month"><h3>${esc(m)}</h3>${groups[m].map(x=>`<button class="calitem" onclick="openActivityForm('${x.id}')"><b>${esc(x.due?.slice(8)||'–')}</b> ${esc(x.title)}</button>`).join('')}</div>`).join('')||'<div class="card empty">No scheduled activities.</div>'}</div>`}if(view==='timeline')body=`<div class="card timeline"><table><thead><tr><th>Activity</th><th>Department</th><th>Owner</th><th>Deadline</th><th>Progress</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.dept)}</td><td>${esc(role(x.role)?.title||'Unassigned')}</td><td>${esc(x.due||'—')}</td><td><div class="bar"><span style="width:${pct(x.progress)}%"></span></div>${pct(x.progress)}%</td></tr>`).join('')}</tbody></table></div>`;let gaps=a.filter(x=>!x.role||role(x.role)?.status==='Open').length;return title('Annual plans & activities','Plan work by department, role, project or strategic priority.')+`<div class="toolbar"><div class="row">${views}<input type="search" placeholder="Find activities" value="${esc(filter)}" oninput="filter=this.value;render(false)"></div><button class="btn primary" onclick="openActivityForm()">+ Add activity</button></div><div class="notice"><b>${gaps} workload gap${gaps===1?'':'s'}</b> · Activities assigned to an open role or without an owner. <span class="help" title="Assign a filled role or plan recruitment before the deadline.">ⓘ</span></div>${body}`}

function showRole(id){let r=role(id);if(!r)return;let manages=state.roles.filter(x=>x.reports===id).map(x=>x.title).join(', ')||'No direct reports';let linked=state.activities.filter(a=>a.role===id);modal(`<div class="modalhead"><div><p class="eyebrow">${esc(r.dept)}</p><h2>${esc(r.title)}</h2><span class="pill ${r.status==='Open'?'open':'filled'}">${esc(r.status)}</span></div><button class="close" onclick="closeModal()">✕</button></div><div class="detail"><dl>${[['Reports to',role(r.reports)?.title||'Board / governing body'],['Manages',manages],['Role holder',r.person||'Open role'],['Purpose',r.purpose],['Main responsibilities',r.responsibilities],['Tasks & deliverables',r.tasks],['Skills & experience',r.skills],['Time / contract',r.commitment],['Internal relationships',r.relationships],['Policies & training',r.policies]].map(([a,b])=>`<dt>${a}</dt><dd>${esc(b)}</dd>`).join('')}</dl><h3>Linked activities (${linked.length})</h3>${linked.map(a=>`<div class="item">${esc(a.title)} · ${esc(a.due||'No date')}</div>`).join('')||'<p class="muted">No activities assigned yet.</p>'}</div><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="openRoleForm('${r.id}')">Edit role</button><button class="btn" onclick="duplicateRole('${r.id}')">Duplicate</button><button class="btn danger" onclick="deleteRole('${r.id}')">Delete</button></div>`)}
function options(list,current){return list.map(([v,l])=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(l)}</option>`).join('')}
function openRoleForm(id='',template=null){let r=id?role(id):template||{};let managers=[['','No manager / governing body'],...state.roles.filter(x=>x.id!==id).map(x=>[x.id,x.title])];modal(`<div class="modalhead"><h2>${id?'Edit role':'Add role'}</h2><button class="close" onclick="closeModal()">✕</button></div><form id="roleform" class="fieldgrid"><label>Role title<input name="title" required value="${esc(r.title||'')}"></label><label>Department<input name="dept" required list="depts" value="${esc(r.dept||'')}"><datalist id="depts">${deptList().map(d=>`<option value="${esc(d)}">`).join('')}</datalist></label><label>Reports to<select name="reports">${options(managers,r.reports||'')}</select></label><label>Status<select name="status">${options([['Open','Open'],['Filled','Filled'],['Volunteer','Volunteer']],r.status||'Open')}</select></label><label>Role holder / team member<input name="person" value="${esc(r.person||'')}"></label><label>Time commitment / contract<input name="commitment" value="${esc(r.commitment||'')}"></label>${[['purpose','Purpose'],['responsibilities','Main responsibilities'],['tasks','Tasks and expected deliverables'],['skills','Essential skills and experience'],['relationships','Key internal relationships'],['policies','Policies, training and compliance']].map(([k,l])=>`<label class="wide">${l}<textarea name="${k}">${esc(r[k]||'')}</textarea></label>`).join('')}<div class="wide actions"><button class="btn primary" type="submit">Save role</button><button class="btn" type="button" onclick="closeModal()">Cancel</button></div></form>`);$('#roleform').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));if(id)Object.assign(role(id),data);else state.roles.push({id:'r'+Date.now(),...data});save();closeModal();render()}}
function duplicateRole(id){let r=role(id);openRoleForm('',{...r,title:r.title+' (copy)',person:'',status:'Open'})}function deleteRole(id){let r=role(id);if(!confirm(`Delete ${r.title}? Linked activities will become unassigned.`))return;state.roles=state.roles.filter(x=>x.id!==id);state.roles.forEach(x=>{if(x.reports===id)x.reports=''});state.activities.forEach(x=>{if(x.role===id)x.role=''});save();closeModal();render()}
function showTemplates(){modal(`<div class="modalhead"><div><h2>Role templates</h2><p class="hint">Choose a starting point, then customise every field.</p></div><button class="close" onclick="closeModal()">✕</button></div><div class="grid roles">${templates.map((t,i)=>`<button class="rolebox" onclick="useTemplate(${i})"><b>${esc(t[0])}</b><small>${esc(t[1])}</small></button>`).join('')}</div>`)}function useTemplate(i){let t=templates[i];openRoleForm('',{title:t[0],dept:t[1],purpose:t[2],responsibilities:t[3],tasks:'Define specific deliverables for your organisation.',skills:'Add relevant skills and experience.',commitment:'To be agreed',relationships:'Add key colleagues and teams.',policies:'Add required policies and training.',status:'Open'})}
function openActivityForm(id=''){let a=state.activities.find(x=>x.id===id)||{};modal(`<div class="modalhead"><h2>${id?'Edit activity':'Add activity'}</h2><button class="close" onclick="closeModal()">✕</button></div><form id="activityform" class="fieldgrid"><label class="wide">Activity<input name="title" required value="${esc(a.title||'')}"></label><label>Department<select name="dept">${options(deptList().map(d=>[d,d]),a.dept||deptList()[0])}</select></label><label>Responsible role<select name="role">${options([['','Unassigned'],...state.roles.map(r=>[r.id,r.title])],a.role||'')}</select></label><label>Strategic priority<input name="priority" value="${esc(a.priority||'')}"></label><label>Project<input name="project" value="${esc(a.project||'')}"></label><label>Deadline<input name="due" type="date" value="${esc(a.due||'')}"></label><label>Budget<input name="budget" type="number" min="0" step="0.01" value="${esc(a.budget??0)}"></label><label>Status<select name="status">${options([['Planned','Planned'],['In progress','In progress'],['Blocked','Blocked'],['Done','Done']],a.status||'Planned')}</select></label><label>Progress %<input name="progress" type="number" min="0" max="100" value="${esc(a.progress??0)}"></label><div class="wide actions"><button class="btn primary" type="submit">Save activity</button>${id?`<button class="btn danger" type="button" onclick="deleteActivity('${id}')">Delete</button>`:''}<button class="btn" type="button" onclick="closeModal()">Cancel</button></div></form>`);$('#activityform').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));data.budget=Number(data.budget)||0;data.progress=pct(data.progress);if(data.role&&role(data.role))data.dept=role(data.role).dept;if(id)Object.assign(state.activities.find(x=>x.id===id),data);else state.activities.push({id:'a'+Date.now(),...data});save();closeModal();render()}}
function deleteActivity(id){if(!confirm('Delete this activity?'))return;state.activities=state.activities.filter(x=>x.id!==id);save();closeModal();render()}
function exportDoc(){let html=`<!doctype html><html><head><meta charset="utf-8"><title>${esc(state.name)} organisation structure</title><style>body{font:11pt Arial;color:#172943;margin:40px}h1{font-size:24pt}h2{border-bottom:1px solid #ccd6df;padding-bottom:5px}h3{margin-bottom:3px}.role{page-break-inside:avoid;margin-bottom:20px}small{color:#64758b}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccd6df;padding:7px;text-align:left}th{background:#eaf0f5}</style><link rel="stylesheet" href="Organisation-Work-Plan.css"></head><body><h1>${esc(state.name)} Organisation Structure</h1><p>Exported ${new Date().toLocaleDateString()}</p><h2>Organigram</h2>${state.roles.map(r=>`<p>${esc(r.title)} · ${esc(r.dept)} · Reports to ${esc(role(r.reports)?.title||'Board / governing body')} · ${esc(r.status)}</p>`).join('')}<h2>Role descriptions</h2>${state.roles.map(r=>`<div class="role"><h3>${esc(r.title)}</h3><small>${esc(r.dept)} · ${esc(r.status)}</small><p><b>Purpose:</b> ${esc(r.purpose)}</p><p><b>Responsibilities:</b> ${esc(r.responsibilities)}</p><p><b>Tasks and deliverables:</b> ${esc(r.tasks)}</p><p><b>Skills:</b> ${esc(r.skills)}</p><p><b>Time / contract:</b> ${esc(r.commitment)}</p><p><b>Relationships:</b> ${esc(r.relationships)}</p><p><b>Policies and training:</b> ${esc(r.policies)}</p></div>`).join('')}<h2>Annual plan</h2><table><tr><th>Activity</th><th>Department</th><th>Role</th><th>Due</th><th>Budget</th><th>Status</th><th>Progress</th></tr>${state.activities.map(a=>`<tr><td>${esc(a.title)}</td><td>${esc(a.dept)}</td><td>${esc(role(a.role)?.title||'Unassigned')}</td><td>${esc(a.due)}</td><td>${esc(a.budget)}</td><td>${esc(a.status)}</td><td>${pct(a.progress)}%</td></tr>`).join('')}</table></body></html>`;let url=URL.createObjectURL(new Blob([html],{type:'application/msword'}));let link=document.createElement('a');link.href=url;link.download='organisation-structure.doc';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));render();
</script><script src="Organisation-Strategy-Content.js"></script><script src="Organisation-Work-Plan.js"></script></body></html>
